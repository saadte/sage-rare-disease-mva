[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
extra_checks = true
files = ["mvapipe", "benchmark", "tools"]

# Allow imports from scikit-learn and SciPy without type stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",       # Add docstrings where contracts need explanation.
    "ICN001",   # Allow full module names instead of required import aliases.
    "PLR2004",  # Allow numeric literals in comparisons.
    "S603",     # Subprocess calls use argument lists without a shell.
    "S311",     # Randomness controls sampling and folds, not security.
    "COM812",   # Let the formatter handle trailing commas.
]

[tool.ruff.lint.per-file-ignores]
"mvapipe/command_line.py" = ["T201"]
"mvapipe/stage_runner.py" = ["T201"]
"benchmark/command_line.py" = ["T201"]
"tools/extract_terms.py" = ["T201"]
"tests/*" = ["S101", "S607"]

[tool.ruff.lint.pylint]
max-args = 6
max-returns = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"
