name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.15 mypy==2.1.0 pytest==9.1.1 numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m mypy --platform win32
      - run: python -m pytest -q
      - run: shellcheck setup/setup_env.sh
      - run: bash -n setup/setup_env.sh
